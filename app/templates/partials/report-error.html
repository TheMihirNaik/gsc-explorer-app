<div role="alert" class="alert alert-error shadow-sm">
    <i class="fa-solid fa-circle-exclamation"></i>
    <div>
        <div class="font-semibold">This report couldn't be built</div>
        <div class="text-sm opacity-90">{{ hint }}</div>
        <details class="mt-2">
            <summary class="text-xs cursor-pointer opacity-70">What Search Console said</summary>
            <div class="text-xs font-mono mt-1 break-all opacity-80">{{ message }}</div>
        </details>
    </div>
</div>
